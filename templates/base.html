<!DOCTYPE html>
{% load static %}

<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="author" content="Reham rady">
    <meta name="description" content="الذكان - منتجات يدوية صنعت بحب">

    <title>{% block title %}الذكان | صُنع يدوياً{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Dancing+Script:wght@500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap 5.3 -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- AOS -->
    <link href="{% static 'css/aos.css' %}" rel="stylesheet">

    <!-- Swiper -->
    <link href="{% static 'css/swiper-bundle.min.css' %}" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">

    <!-- Magnific Popup -->
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">

    <!-- Main Style -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/dk-theme.css' %}">


    {% block extra_css %}
    {% endblock %}
</head>


<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <div id="topbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

                <!-- Right -->
                <div class="top-contact">
                    <span>
                        <i class="fas fa-heart"></i>
                        صُنع يدوياً بحب
                    </span>
                </div>

                <!-- Left -->
                <div class="d-flex align-items-center gap-3">

                    <span class="ttag">
                        <i class="fas fa-location-dot"></i>
                        التوصيل داخل السويس
                    </span>

                    <div class="tsoc">

                        <a href="#" aria-label="Facebook">
                            <i class="fab fa-facebook-f"></i>
                        </a>

                        <a href="#" aria-label="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>

                        <a href="#" aria-label="TikTok">
                            <i class="fab fa-tiktok"></i>
                        </a>

                        <a href="#" aria-label="YouTube">
                            <i class="fab fa-youtube"></i>
                        </a>

                    </div>

                </div>

            </div>
        </div>
    </div>


    <!-- =========================
         NAVBAR
    ========================== -->

    {% include 'parts/navbar.html' %}


    <!-- =========================
         PAGE CONTENT
    ========================== -->

    <main>
        {% block body %}
        {% endblock %}
    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    {% include 'parts/footer.html' %}


    <!-- =========================
         BACK TO TOP
    ========================== -->

    <button id="btt"
            aria-label="العودة إلى الأعلى"
            onclick="window.scrollTo({top: 0, behavior: 'smooth'})">

        <i class="fas fa-chevron-up"></i>

    </button>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <!-- jQuery -->
    <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>

    <!-- Bootstrap -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

    <!-- AOS -->
    <script src="{% static 'js/aos.js' %}"></script>

    <!-- Swiper -->
    <script src="{% static 'js/swiper-bundle.min.js' %}"></script>

    <!-- Magnific Popup -->
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>

    <!-- Main JS -->
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
