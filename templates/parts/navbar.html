   /* =========================================
   DAKKAN NAVBAR

#nav {

}

========================================= */

.brand-logo {

}

.brand-logo:hover {

}

#nav .navbar-nav {

#nav .nav-link:hover,

#nav .nav-link::after {

    left: 13px;
    bottom: 3px;

    height: 2px;

    background: #b27a3c;

    transform: scaleX(0);
    transform-origin: center;

    transition: 0.3s ease;
}

#nav .nav-link:hover::after,
#nav .nav-link.active::after {

}

    transition: 0.3s ease;
}

#navSearchBtn:hover {

    color: white;

    align-items: center;
    justify-content: center;

    position: relative;

    text-decoration: none;

    transition: 0.3s ease;
}

.nav-cart:hover {
    background: #b27a3c;
    color: white;
}

.cart-count {

.nav-cta:hover {

    .nav-actions {

    .nav-cta {

        text-align: center;
